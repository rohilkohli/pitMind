# Nginx configuration for pitMind Production (with SSL and WebSocket support)

# Redirect HTTP to HTTPS
server {
    listen 8080;
    server_name 52.118.185.48.nip.io;

    # Health check endpoint bypass (so Docker container health checks succeed without SSL)
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 8443 ssl;
    server_name 52.118.185.48.nip.io;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/52.118.185.48.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52.118.185.48.nip.io/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://maps.gstatic.com https://*.googleapis.com https://*.googleusercontent.com; frame-src 'self' https://*.firebaseapp.com; connect-src 'self' ws: wss: http: https:;" always;

    # API Proxy with WebSocket Support
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        
        # Enable WebSocket upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for streaming WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health endpoint direct proxy
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Frontend Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
